version: '3.8'

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: webifylab_api
    restart: always
    # Port 8080 tidak perlu diekspos ke public host karena di-proxy oleh nginx
    expose:
      - "8080"
    env_file:
      - ./apps/api/.env
    # Kita tidak membutuhkan PostgreSQL lokal karena menggunakan Supabase

  nginx:
    image: nginx:alpine
    container_name: webifylab_nginx
    restart: always
    ports:
      - "80:80"
      # Buka port 443 jika Anda setup SSL di dalam docker
      # - "443:443" 
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
