version: "3.8"

services:
  frontend:
    image: webifylab-frontend:latest # Akan di-replace oleh GitHub Actions
    container_name: webifylab-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${API_URL}
      - NEXT_PUBLIC_SITE_URL=${SITE_URL}
    networks:
      - webifylab-network
    deploy:
      resources:
        limits:
          memory: 350M

  backend:
    image: webifylab-backend:latest # Akan di-replace oleh GitHub Actions
    container_name: webifylab-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV}
      - APP_PORT=8080
      - APP_HOST=0.0.0.0
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSLMODE=disable
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRY=24h
      - REFRESH_TOKEN_EXPIRY=168h
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - FRONTEND_URL=${SITE_URL}
      - CORS_ORIGIN=${SITE_URL}
      - UPLOAD_DIR=/app/uploads
      - MAX_UPLOAD_SIZE=5242880
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - webifylab-network
    deploy:
      resources:
        limits:
          memory: 150M

  postgres:
    image: postgres:15-alpine
    container_name: webifylab-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webifylab-network
    deploy:
      resources:
        limits:
          memory: 200M

networks:
  webifylab-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
