version: "3.8"

services:
  # ─── Nginx (Web Server + Reverse Proxy) ───
  web:
    image: nginx:alpine
    container_name: webifylab-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/webifylab/web:/usr/share/nginx/html:ro
      - /opt/webifylab/infra/nginx/webifylab.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/webifylab/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks: [webifylab]
    deploy:
      resources:
        limits:
          memory: 64M
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Golang API ───
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: webifylab-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-webifylab}
      DB_PASSWORD: ${DB_PASSWORD:-Rahasia123!}
      DB_NAME: ${DB_NAME:-webifylab}
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
    networks: [webifylab]
    deploy:
      resources:
        limits:
          memory: 128M
    logging: *logging

  # ─── PostgreSQL ───
  db:
    image: postgres:16-alpine
    container_name: webifylab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-webifylab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Rahasia123!}
      POSTGRES_DB: ${DB_NAME:-webifylab}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [webifylab]
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-webifylab} -d ${DB_NAME:-webifylab}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=16MB"
      - "-c"
      - "effective_cache_size=256MB"
    logging: *logging

volumes:
  pgdata:

networks:
  webifylab:
    driver: bridge
