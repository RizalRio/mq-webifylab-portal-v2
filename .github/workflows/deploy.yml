name: Build & Deploy WebifyLab Portal

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger

env:
  REGISTRY: ghcr.io
  # PENTING: Ganti dengan username/repo kamu dalam HURUF KECIL semua!
  REPO: rizalrio/mq-webifylab-portal-v2
  IMAGE_NAME_FRONTEND: webifylab-frontend
  IMAGE_NAME_BACKEND: webifylab-backend
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  VPS_DIR: /var/www/webifylab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE_NAME_BACKEND }}:latest
            ${{ env.REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ${{ env.VPS_DIR }}

            # Login to GHCR
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull new images
            docker pull ${{ env.REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
            docker pull ${{ env.REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE_NAME_BACKEND }}:latest

            # Update docker-compose.yml to use GHCR images
            sed -i 's|image: webifylab-frontend:latest|image: ${{ env.REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE_NAME_FRONTEND }}:latest|g' docker-compose.yml
            sed -i 's|image: webifylab-backend:latest|image: ${{ env.REGISTRY }}/${{ env.REPO }}/${{ env.IMAGE_NAME_BACKEND }}:latest|g' docker-compose.yml

            # Restart containers
            docker compose down
            docker compose up -d

            # Run migrations
            sleep 10
            docker compose exec -T backend ./server migrate || true

            # Cleanup old images
            docker image prune -f

            echo "✅ Deployment successful!"
